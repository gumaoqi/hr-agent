# Netlify 站点配置（Netlify + Supabase 部署）
[build]
  # 强制 Node 22（serverless-http v3 兼容 Node 18+；Express + WASM 解码器需要较新运行时）
  environment = { NODE_VERSION = "22" }
  # 构建在仓库根执行：先安装 server 依赖（函数打包需要 node_modules），再构建前端
  base = "."
  command = "cd server && npm ci --no-audit --no-fund && cd ../frontend && npm ci --no-audit --no-fund && npm run build"
  publish = "frontend/dist"

# 后端函数：serverless-http 包装 Express（Node 20 运行时）
# zisi 模式（zip-it-and-ship-it）：函数目录 + server/package.json 依赖原样打包部署
# （wasm 解码器等特殊包免 esbuild 打包风险）
[functions]
  directory = "server/functions"
  # nft（Node File Trace）：官方默认打包器，原生支持 ESM 与函数目录外的相对导入（api.mjs → ../index.js），
  # 且保留 wasm 文件结构（mpg123-decoder / @wasm-audio-decoders 等无需特殊处理）
  node_bundler = "nft"

# 岗位普查需调用 DeepSeek 搜索+生成，10s 默认超时不够，提升到 26s 上限
# included_files 打包 pdfkit 中文 TT 字体（运行时路径 nft 无法静态追踪）
[functions."api"]
  timeout = 26
  included_files = ["server/fonts/simhei.ttf"]

# 前端 /api/* 请求重写为函数（Netlify 保留原始 event.path，Express 路由无需改动）
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

# 根路由健康检查
[[redirects]]
  from = "/"
  to = "/.netlify/functions/api"
  status = 200
